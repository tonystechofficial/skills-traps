<!DOCTYPE html>
<!--
    WHISKER HARMONICS - Feline Movement Through Algorithmic Flow
    A generative art piece exploring the grace and precision of cat movement
    through computational choreography and particle harmonics.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whisker Harmonics - Generative Art</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }

        /* Responsive - Stack on mobile */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <!-- Headers -->
            <h1>Whisker Harmonics</h1>
            <div class="subtitle">Feline movement through algorithmic choreography</div>

            <!-- Seed Section -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <!-- Parameters Section -->
            <div class="control-section">
                <h3>Parameters</h3>
                
                <!-- Particle Count -->
                <div class="control-group">
                    <label>Particle Count</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="2000" max="15000" step="500" value="6000" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">6000</span>
                    </div>
                </div>

                <!-- Flow Intensity -->
                <div class="control-group">
                    <label>Flow Intensity</label>
                    <div class="slider-container">
                        <input type="range" id="flowIntensity" min="0.5" max="3.0" step="0.1" value="1.5" oninput="updateParam('flowIntensity', this.value)">
                        <span class="value-display" id="flowIntensity-value">1.5</span>
                    </div>
                </div>

                <!-- Noise Scale (Turbulence) -->
                <div class="control-group">
                    <label>Turbulence</label>
                    <div class="slider-container">
                        <input type="range" id="turbulence" min="0.003" max="0.025" step="0.001" value="0.008" oninput="updateParam('turbulence', this.value)">
                        <span class="value-display" id="turbulence-value">0.008</span>
                    </div>
                </div>

                <!-- Trail Fade -->
                <div class="control-group">
                    <label>Trail Persistence</label>
                    <div class="slider-container">
                        <input type="range" id="trailFade" min="1" max="10" step="0.5" value="4.5" oninput="updateParam('trailFade', this.value)">
                        <span class="value-display" id="trailFade-value">4.5</span>
                    </div>
                </div>

                <!-- Velocity Influence -->
                <div class="control-group">
                    <label>Velocity Saturation</label>
                    <div class="slider-container">
                        <input type="range" id="velocitySaturation" min="0.3" max="1.5" step="0.1" value="1.0" oninput="updateParam('velocitySaturation', this.value)">
                        <span class="value-display" id="velocitySaturation-value">1.0</span>
                    </div>
                </div>
            </div>

            <!-- Colors Section -->
            <div class="control-section">
                <h3>Colors</h3>
                
                <!-- Color 1 - Primary -->
                <div class="color-group">
                    <label>Primary Accent</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#c95d4a" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#c95d4a</span>
                    </div>
                </div>

                <!-- Color 2 - Secondary -->
                <div class="color-group">
                    <label>Secondary Flow</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#5a8bb8" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#5a8bb8</span>
                    </div>
                </div>

                <!-- Color 3 - Accent -->
                <div class="color-group">
                    <label>Shadow Depth</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#3d2e2e" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#3d2e2e</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // WHISKER HARMONICS - PARAMETRIC CONFIGURATION
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 12345,
            particleCount: 6000,
            flowIntensity: 1.5,
            turbulence: 0.008,
            trailFade: 4.5,
            velocitySaturation: 1.0,
            colorPalette: ['#c95d4a', '#5a8bb8', '#3d2e2e']
        };

        let defaultParams = {...params};

        // ═══════════════════════════════════════════════════════════════════════
        // GENERATIVE ART: WHISKER HARMONICS
        // A choreography of particles flowing through invisible force fields,
        // their trails accumulating into feline essence
        // ═══════════════════════════════════════════════════════════════════════

        let particles = [];
        let flowField = [];
        let trailCanvas;
        let cols, rows;
        let scl = 15; // Flow field resolution (larger = coarser flow)
        let time = 0;

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            
            // Create a separate canvas for accumulating trails
            trailCanvas = createGraphics(1200, 1200);
            
            initializeSystem();
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            
            particles = [];
            time = 0;
            
            // Initialize trail canvas with semi-transparent background
            trailCanvas.background(250, 249, 245);
            
            // Birth particles along edges and scattered throughout
            const edgeParticles = Math.floor(params.particleCount * 0.3);
            const scatteredParticles = params.particleCount - edgeParticles;
            
            // Edge-born particles (curious explorers)
            for (let i = 0; i < edgeParticles; i++) {
                let p = new Particle();
                p.x = random(width);
                p.y = random([random(-50, 0), random(height, height + 50)]);
                particles.push(p);
            }
            
            // Scattered particles (ambient inhabitants)
            for (let i = 0; i < scatteredParticles; i++) {
                particles.push(new Particle());
            }
            
            // Calculate flow field dimensions
            cols = floor(width / scl) + 1;
            rows = floor(height / scl) + 1;
            
            generateFlowField();
            background(250, 249, 245);
        }

        function generateFlowField() {
            flowField = [];
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    // Multi-octave Perlin noise for organic complexity
                    let angle = noise(
                        x * params.turbulence * 0.5,
                        y * params.turbulence * 0.5,
                        time * 0.01
                    ) * TWO_PI * 2;
                    
                    angle += noise(
                        x * params.turbulence * 2,
                        y * params.turbulence * 2,
                        time * 0.02
                    ) * PI * 0.5;
                    
                    let v = p5.Vector.fromAngle(angle);
                    flowField.push(v);
                }
            }
        }

        function draw() {
            // Update flow field every frame for temporal evolution
            generateFlowField();
            time += 1;
            
            // Update particles and draw trails
            for (let p of particles) {
                p.follow(flowField, cols, rows, scl);
                p.update();
                p.wrapAround();
                p.display(trailCanvas);
            }
            
            // Apply fade to trails (decay over time)
            trailCanvas.fill(250, 249, 245, params.trailFade);
            trailCanvas.rect(0, 0, width, height);
            
            // Composite trail canvas onto main canvas
            image(trailCanvas, 0, 0);
        }

        // ═══════════════════════════════════════════════════════════════════════
        // PARTICLE CLASS - Meticulously refined particle behavior
        // ═══════════════════════════════════════════════════════════════════════

        class Particle {
            constructor() {
                this.x = random(width);
                this.y = random(height);
                this.vx = 0;
                this.vy = 0;
                this.maxspeed = 4;
                this.velocity = 0;
                this.trailIndex = 0;
            }

            follow(flowField, cols, rows, scl) {
                // Find appropriate flow vector
                let x = floor(this.x / scl);
                let y = floor(this.y / scl);
                x = constrain(x, 0, cols - 1);
                y = constrain(y, 0, rows - 1);
                
                let idx = y * cols + x;
                if (idx < flowField.length) {
                    let force = flowField[idx].copy();
                    force.mult(params.flowIntensity);
                    this.vx += force.x;
                    this.vy += force.y;
                }
            }

            update() {
                // Dampen velocity for organic motion
                this.vx *= 0.92;
                this.vy *= 0.92;
                
                // Apply speed limit
                let speed = sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > this.maxspeed) {
                    this.vx = (this.vx / speed) * this.maxspeed;
                    this.vy = (this.vy / speed) * this.maxspeed;
                }
                
                this.velocity = speed;
                this.x += this.vx;
                this.y += this.vy;
            }

            wrapAround() {
                // Respawn at edges creating continuous flow
                if (this.x < -10) this.x = width + 10;
                if (this.x > width + 10) this.x = -10;
                if (this.y < -10) this.y = height + 10;
                if (this.y > height + 10) this.y = -10;
            }

            display(canvas) {
                // Color emerges from velocity - fast particles burn bright
                let hue = map(this.velocity, 0, 4, 200, 20); // Blue to orange
                let saturation = this.velocity * params.velocitySaturation * 100;
                saturation = constrain(saturation, 20, 100);
                let brightness = map(this.velocity, 0, 4, 40, 90);
                
                canvas.colorMode(HSB);
                canvas.stroke(hue, saturation, brightness, 60);
                canvas.strokeWeight(1.5);
                canvas.point(this.x, this.y);
                canvas.colorMode(RGB);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI CONTROL HANDLERS
        // ═══════════════════════════════════════════════════════════════════════

        function updateParam(paramName, value) {
            value = parseFloat(value);
            params[paramName] = value;
            
            // Update value display
            document.getElementById(paramName + '-value').textContent = 
                value.toFixed(value < 1 ? 2 : 0);
            
            // Reinitialize if particle count changed
            if (paramName === 'particleCount') {
                initializeSystem();
            }
        }

        function updateColor(colorId, value) {
            let index = parseInt(colorId.replace('color', '')) - 1;
            params.colorPalette[index] = value;
            document.getElementById(colorId + '-value').textContent = value;
        }

        // ═══════════════════════════════════════════════════════════════════════
        // SEED CONTROL FUNCTIONS
        // ═══════════════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            
            // Update all UI elements
            document.getElementById('particleCount').value = params.particleCount;
            document.getElementById('particleCount-value').textContent = params.particleCount;
            document.getElementById('flowIntensity').value = params.flowIntensity;
            document.getElementById('flowIntensity-value').textContent = params.flowIntensity.toFixed(1);
            document.getElementById('turbulence').value = params.turbulence;
            document.getElementById('turbulence-value').textContent = params.turbulence.toFixed(3);
            document.getElementById('trailFade').value = params.trailFade;
            document.getElementById('trailFade-value').textContent = params.trailFade.toFixed(1);
            document.getElementById('velocitySaturation').value = params.velocitySaturation;
            document.getElementById('velocitySaturation-value').textContent = params.velocitySaturation.toFixed(1);
            
            document.getElementById('color1').value = params.colorPalette[0];
            document.getElementById('color1-value').textContent = params.colorPalette[0];
            document.getElementById('color2').value = params.colorPalette[1];
            document.getElementById('color2-value').textContent = params.colorPalette[1];
            document.getElementById('color3').value = params.colorPalette[2];
            document.getElementById('color3-value').textContent = params.colorPalette[2];
            
            updateSeedDisplay();
            initializeSystem();
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
